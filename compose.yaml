networks:
  web:
    external: true
    name: homelab-web

services:
  # The static front for the whole tracker family (consolidated 2026-11-14):
  # econ plus the eleven sibling sites, one nginx, picked by Host header. Each
  # sibling's updater still runs from its own repo; only the nginx moved here.
  # After editing any sibling's src/, redeploy from here (the sibling deploy.sh
  # files call this one).
  econ:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        debt: ../debt/src
        jobs: ../jobs/src
        yield: ../yield/src
        housing: ../housing/src
        credit: ../credit/src
        lending: ../lending/src
        consumer: ../consumer/src
        output: ../output/src
        freight: ../freight/src
        equity: ../equity/src
        diesel: ../diesel/src
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: econ
    restart: unless-stopped
    depends_on:
      - econ-updater
    networks:
      web:
        # The old per-site container names. Caddy, Uptime Kuma, the catalog
        # health URLs and econ-updater's sibling fetches all address the sites
        # as http://<site>:80, so answering to those names keeps every caller
        # working unchanged.
        aliases:
          - debt
          - jobs
          - yield
          - housing
          - credit
          - lending
          - consumer
          - output
          - freight
          - equity
          - diesel
    ports:
      - "8137:80"
    volumes:
      # Read-only here: nginx serves each data layer, the updaters own them.
      # diesel has no entry: its front reads everything through /api/.
      - ./data:/usr/share/nginx/html/econ/data:ro
      - ../debt/data:/usr/share/nginx/html/debt/data:ro
      - ../jobs/data:/usr/share/nginx/html/jobs/data:ro
      - ../yield/data:/usr/share/nginx/html/yield/data:ro
      - ../housing/data:/usr/share/nginx/html/housing/data:ro
      - ../credit/data:/usr/share/nginx/html/credit/data:ro
      - ../lending/data:/usr/share/nginx/html/lending/data:ro
      - ../consumer/data:/usr/share/nginx/html/consumer/data:ro
      - ../output/data:/usr/share/nginx/html/output/data:ro
      - ../freight/data:/usr/share/nginx/html/freight/data:ro
      - ../equity/data:/usr/share/nginx/html/equity/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      # This box runs a lot of containers; a build next door can push a
      # trivial probe past a short deadline (learned on debt).
      timeout: 15s
      retries: 3
      start_period: 15s

  econ-updater:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: econ-updater
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # /api/health 503s until the first fetch lands; the warm fetch pulls
      # ten sibling trackers over the web network, so give it room.
      start_period: 120s
