# One nginx serves the whole economic tracker family (consolidated 2026-11-14).
#
# Before, each of the twelve sites ran its own nginx container on its own host
# port. They were byte-identical apart from the updater they proxied /api/ to,
# so this container now serves all of them, picking the site by Host header.
#
# Each server_name lists both the public host (what Caddy forwards) and the
# bare container name. The bare name matters: econ-updater fetches its
# siblings at http://<site>:80/api/data over homelab-web, and this container
# answers to those names through the network aliases in compose.yaml.
#
# Each site's updater still runs in its own repo and container; only the
# static front moved here. Site files live at /usr/share/nginx/html/<site>/.

gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 1024;
gzip_proxied any;

# Docker's embedded DNS, for the request-time updater lookups.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    # default_server: the healthcheck and LAN hits on :8137 by IP land here.
    server_name econ econ.chrislawrence.ca;
    root /usr/share/nginx/html/econ;
    set $updater http://econ-updater:8000;
    include /etc/nginx/snippets/tracker-locations.conf;
}

