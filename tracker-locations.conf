# Per-site locations, included by every server block in nginx.conf.
#
# Each server sets $updater to its own sidecar before including this. The
# rules here are the ones every tracker's own nginx.conf carried before the
# family was consolidated onto this one container (2026-11-14).

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The data layer is bind-mounted, not baked into the image, so each updater
# can rewrite a series without a rebuild. no-cache keeps a browser from
# holding a stale figure after a scheduled run.
location /data/ {
    add_header Cache-Control "no-cache";
    default_type application/json;
}

# proxy_pass through a variable resolves the updater at request time, so one
# updater being down (or not yet started) cannot stop this container from
# starting and serving the other eleven sites. With no URI part on the
# variable, nginx forwards the original request URI unchanged, which is what
# the old per-site `proxy_pass http://<site>-updater:8000;` did.
location /api/ {
    proxy_pass $updater;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

location / {
    index index.html;
    try_files $uri $uri/ /index.html;
}
